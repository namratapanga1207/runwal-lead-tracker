services:
  - type: web
    name: runwal-lead-tracker-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: METABASE_URL
        value: https://metabase.limechat.ai
      - key: METABASE_API_KEY
        sync: false
      - key: ACCOUNT_ID
        value: "28982"
      - key: CLICKHOUSE_DATABASE_ID
        value: "82"
      - key: CORS_ORIGINS
        value: https://runwal-lead-tracker.vercel.app
      - key: DASHBOARD_PASSWORD
        value: L!M3CH@T4767
